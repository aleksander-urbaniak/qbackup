apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbackup
  namespace: qbackup
  labels:
    app.kubernetes.io/name: qbackup
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qbackup
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbackup
    spec:
      serviceAccountName: qbackup
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qbackup
          image: qbackup:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8787
              name: http
          env:
            - name: PORT
              value: "8787"
            - name: HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /data/.config
            - name: XDG_DATA_HOME
              value: /data/.local/share
            - name: QBACKUP_SECURE_COOKIES
              value: "true"
            - name: QBACKUP_TRUST_PROXY
              value: "true"
            - name: QBACKUP_BOOTSTRAP_CLUSTER
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qbackup-data
        - name: tmp
          emptyDir: {}
